name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Constitution Gate: lint + format (zero warnings)
      - name: Lint & format check
        run: npm run lint

      # Constitution Gate: type safety
      - name: Typecheck
        run: npm run typecheck

      # Constitution Gate: unit tests WITH coverage threshold.
      # vitest exits non-zero if coverage falls below the configured thresholds,
      # enforcing "coverage MUST NOT decrease".
      - name: Unit tests (with coverage)
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Constitution Gate: end-to-end + accessibility (axe)
      - name: E2E + accessibility tests
        run: npm run test:e2e

      # Constitution Gate: clean production build
      - name: Build
        run: npm run build

      # Constitution Gate: performance / Core Web Vitals budgets
      - name: Lighthouse CI
        run: npm run lighthouse
